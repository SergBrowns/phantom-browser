app-id: io.github.anthropic.PhantomBrowser
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: phantom-browser

finish-args:
  # Display
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  # GPU acceleration
  - --device=dri
  # Network
  - --share=network
  # Audio
  - --socket=pulseaudio
  # User directories — только загрузки; документы доступны через portal FileChooser без прямого доступа
  - --filesystem=xdg-download
  # Printing
  - --socket=cups
  # Notifications
  - --talk-name=org.freedesktop.Notifications
  # Webcam & devices
  # --device=all нужен для доступа к v4l2 (вебкамера) в Firefox без поддержки camera portal.
  # Как только Gecko реализует xdg-desktop-portal camera, заменить на --device=dri.
  - --device=all
  # Portal access (screen sharing, file chooser)
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=org.freedesktop.portal.ScreenCast
  # DNS resolution (systemd-resolved fallback)
  - --system-talk-name=org.freedesktop.resolve1
  # Network state detection
  - --system-talk-name=org.freedesktop.NetworkManager
  # MPRIS (media keys)
  - --own-name=org.mpris.MediaPlayer2.phantom.*
  # Spell check
  - --env=DICPATH=/usr/share/hunspell

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: sing-box
    buildsystem: simple
    build-commands:
      - install -Dm755 sing-box /app/bin/sing-box
    sources:
      - type: file
        path: /usr/bin/sing-box

  - name: phantom-browser
    buildsystem: simple
    build-commands:
      - install -d /app/lib/phantom
      - cp -r phantom/* /app/lib/phantom/
      - chmod +x /app/lib/phantom/phantom
      - install -Dm755 phantom-browser.sh /app/bin/phantom-browser
      - install -Dm644 io.github.anthropic.PhantomBrowser.desktop /app/share/applications/io.github.anthropic.PhantomBrowser.desktop
      - install -Dm644 io.github.anthropic.PhantomBrowser.metainfo.xml /app/share/metainfo/io.github.anthropic.PhantomBrowser.metainfo.xml
      - |
        for size in 16 32 48 64 128 256 512; do
          install -Dm644 "phantom/browser/chrome/icons/default/default${size}.png" \
            "/app/share/icons/hicolor/${size}x${size}/apps/io.github.anthropic.PhantomBrowser.png"
        done
    sources:
      - type: archive
        path: phantom-155.1.tar.xz
        strip-components: 0
      - type: file
        path: phantom-browser.sh
      - type: file
        path: io.github.anthropic.PhantomBrowser.desktop
      - type: file
        path: io.github.anthropic.PhantomBrowser.metainfo.xml
