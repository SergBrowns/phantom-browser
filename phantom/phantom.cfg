// Phantom Browser — Default Configuration

// ── Telemetry off ────────────────────────────────────────────────────────────
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("toolkit.telemetry.archive.enabled", false);
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("browser.ping-centre.telemetry", false);
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("app.normandy.enabled", false);
lockPref("browser.newtabpage.activity-stream.telemetry", false);
lockPref("browser.newtabpage.activity-stream.feeds.telemetry", false);

// ── DNS over HTTPS — обходит DNS-блокировки (YouTube, etc.) ─────────────────
// mode 2 = DoH first, fallback to system DNS if DoH unavailable
// DPI engine will upgrade to mode 3 AFTER verifying DoH is reachable
defaultPref("network.trr.mode", 2);
defaultPref("network.trr.uri", "https://dns.adguard-dns.com/dns-query");
defaultPref("network.trr.bootstrapAddress", "94.140.14.14");
// Domains excluded from DoH — resolved via system DNS (ISP).
// Gov/banking sites often require ISP DNS or block foreign DNS responses.
defaultPref("network.trr.excluded-domains", "localhost,local,gosuslugi.ru,mos.ru,nalog.gov.ru,pfr.gov.ru,cbr.ru,kremlin.ru,government.ru,mvd.ru,fsb.ru,mil.ru,esia.gosuslugi.ru,lk.gosuslugi.ru,pos.gosuslugi.ru,sberbank.ru,online.sberbank.ru,vtb.ru,gazprombank.ru,tinkoff.ru,alfa-bank.ru");
defaultPref("network.dns.skipTRR-when-parental-control-enabled", false);
// Ensure TRR connections are not disabled when our DPI proxy filter is active
defaultPref("network.trr.disable-when-proxy-detected", false);

// ── ECH (Encrypted Client Hello) — скрывает домен от DPI ────────────────────
lockPref("network.dns.echconfig.enabled", true);
lockPref("network.dns.http3_echconfig.enabled", true);

// ── HTTP/3 (QUIC) — быстрее и труднее блокировать ────────────────────────────
defaultPref("network.http.http3.enabled", true);
defaultPref("network.http.http3.alt-svc-mapping-for-testing", "");

// ── Performance ───────────────────────────────────────────────────────────────
defaultPref("gfx.webrender.all", true);
defaultPref("layers.acceleration.enabled", true);
defaultPref("gfx.canvas.accelerated", true);

// Network throughput
defaultPref("network.http.max-persistent-connections-per-server", 10);
defaultPref("network.http.max-persistent-connections-per-proxy", 48);
defaultPref("network.http.max-connections", 1800);
defaultPref("network.http.pipelining", true);
defaultPref("network.http.fast-fallback-to-IPv4", true);
defaultPref("network.ssl_tokens_cache_capacity", 32768);

// Prefetch & preconnect
defaultPref("network.prefetch-next", true);
defaultPref("network.dns.disablePrefetch", false);
defaultPref("network.dns.disablePrefetchFromHTTPS", false);
defaultPref("network.http.speculative-parallel-limit", 10);
defaultPref("network.predictor.enabled", true);
defaultPref("network.predictor.enable-hover-on-ssl", true);
defaultPref("network.predictor.enable-prefetch", true);

// Cache tuning
defaultPref("browser.cache.disk.smart_size.enabled", true);
defaultPref("browser.cache.memory.capacity", 524288);
defaultPref("browser.cache.memory.max_entry_size", 51200);

// Session store — reduce disk writes (30s instead of 15s)
defaultPref("browser.sessionstore.interval", 30000);

// Reduce reflow/repaint
defaultPref("content.notify.interval", 100000);

// ── Privacy defaults ─────────────────────────────────────────────────────────
defaultPref("privacy.trackingprotection.enabled", true);
defaultPref("privacy.trackingprotection.socialtracking.enabled", true);
defaultPref("network.cookie.cookieBehavior", 1);
defaultPref("dom.security.https_only_mode", false);
defaultPref("privacy.resistFingerprinting", false);
defaultPref("geo.enabled", false);
defaultPref("media.peerconnection.ice.no_host", true);

// ── UI ────────────────────────────────────────────────────────────────────────
lockPref("extensions.pocket.enabled", false);
defaultPref("identity.fxaccounts.enabled", false);
defaultPref("browser.tabs.drawInTitlebar", true);
defaultPref("browser.compactmode.show", true);

// ── Phantom features ─────────────────────────────────────────────────────────
defaultPref("phantom.spaces.enabled", true);
defaultPref("phantom.blocker.enabled", true);
defaultPref("phantom.reader.enabled", true);
defaultPref("phantom.ai.enabled", true);
defaultPref("phantom.ai.provider", "");
defaultPref("phantom.ai.apiKey", "");
defaultPref("phantom.ai.model", "");
defaultPref("phantom.ai.ollamaUrl", "http://localhost:11434");
defaultPref("phantom.smarthistory.enabled", true);
defaultPref("phantom.smarthistory.maxAgeDays", 90);
defaultPref("phantom.verticaltabs.enabled", true);
defaultPref("phantom.focusmode.enabled", true);
// ── Proxy Manager ────────────────────────────────────────────────────────────
defaultPref("phantom.proxy.enabled", false);
defaultPref("phantom.proxy.activeProfile", "");
defaultPref("phantom.proxy.failover", true);

// ── DPI Bypass v2 ────────────────────────────────────────────────────────────
defaultPref("phantom.dpi.enabled", true);
defaultPref("phantom.dpi.strategy", "split_sni");
defaultPref("phantom.dpi.fragment.delay", 50);
defaultPref("phantom.dpi.fragment.microsize", 3);
defaultPref("phantom.dpi.bypass.all", false);
defaultPref("phantom.dpi.quic.disable", true);
defaultPref("phantom.dpi.doh.provider", "adguard");
defaultPref("phantom.dpi.doh.custom.url", "");
defaultPref("phantom.dpi.doh.custom.bootstrap", "");
defaultPref("phantom.dpi.list.urls", "https://antifilter.download/list/domains.lst");

// ── VPN (sing-box) ───────────────────────────────────────────────────────────
defaultPref("phantom.vpn.enabled", true);
defaultPref("phantom.vpn.autoConnect", false);
defaultPref("phantom.vpn.subscriptionUrl", "");
defaultPref("phantom.vpn.activeServer", "");
defaultPref("phantom.vpn.socksPort", 10808);
defaultPref("phantom.vpn.httpPort", 10809);

// ── New Tab ───────────────────────────────────────────────────────────────────
lockPref("browser.startup.homepage_override.mstone", "ignore");
try {
    const aboutNewTabService = Cc["@mozilla.org/browser/aboutnewtab-service;1"]
        .getService(Ci.nsIAboutNewTabService);
    aboutNewTabService.newTabURL = "chrome://phantom/content/new-tab/new-tab.html";
} catch(e) {}
